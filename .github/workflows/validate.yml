name: Validate data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The ruleset on main requires this job; keep its name stable.
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install 'jsonschema[format]>=4.18'
      # Public snapshot only: PR code must never receive the private source token.
      - run: uv run python scripts/build.py --published
      - run: uv run python -m unittest discover -s tests
